name: Verify Godot Edition

on:
  push:
    branches:
      - main
    paths: &godot-paths
      - "apps/godot/**"
      - "shared/**"
      - "tools/soundscape-build/**"
      - "package.json"
      - "docs/godot-release.md"
      - ".github/workflows/verify-godot.yml"
  pull_request:
    branches:
      - main
    paths: *godot-paths

permissions:
  contents: read

concurrency:
  group: verify-godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Godot Edition construction
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GODOT_CI_ROOT: ${{ github.workspace }}/.godot-ci
      GODOT_BIN: ${{ github.workspace }}/.godot-ci/Godot.app/Contents/MacOS/Godot

    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Inspect the Godot verification workflow
        run: apps/godot/tests/godot_ci_inspection.sh

      - name: Install Godot 4.7.2 Standard and macOS export templates
        run: apps/godot/packaging/install_ci_godot.sh

      - name: Verify the exact Godot 4.7.2 Standard version
        run: |
          test -x "$GODOT_BIN"
          version="$("$GODOT_BIN" --version)"
          printf '%s\n' "$version"
          case "$version" in
            4.7.2.stable.official*) ;;
            *)
              echo "FAIL: expected Godot 4.7.2 Standard, found $version" >&2
              exit 1
              ;;
          esac
          test -s "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/macos.zip"

      - name: Run the headless Godot acceptance suite
        run: npm run test:godot

      - name: Validate Runtime Edition Pack construction
        run: |
          "$GODOT_BIN" --headless --path apps/godot \
            --script res://packaging/validate_runtime_edition_pack.gd \
            -- "${GITHUB_WORKSPACE}/shared/edition"

      - name: Inspect release metadata without launching
        run: apps/godot/tests/release_export_inspection.sh

      - name: Inspect the packaged Runtime Edition Pack for forbidden content
        run: |
          apps/godot/packaging/inspect_packaged_pck.sh \
            "apps/godot/build/release/Princess Rosie.app/Contents/Resources/Princess Rosie and the Seven Birthday Stars.pck"

      - name: Inspect the release archive without launching or uploading
        run: apps/godot/tests/release_archive_inspection.sh
